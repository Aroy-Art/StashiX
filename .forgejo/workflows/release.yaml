name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: git.aroy-art.com
  IMAGE: git.aroy-art.com/aroy/stashix

jobs:
  release:
    runs-on: act-ubuntu-24.04-amd64

    steps:
      - name: checkout code
        uses: https://code.forgejo.org/actions/checkout@v7

      # The tag, mix.exs and the image pinned in docker-compose.yml must all
      # name the same version, so the tagged compose file runs this release.
      - name: check versions match the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mix_version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' stashix_web/mix.exs)
          compose_version=$(sed -n 's|^ *image: ${{ env.IMAGE }}:\(.*\)$|\1|p' docker-compose.yml)
          echo "tag=$tag mix.exs=$mix_version docker-compose.yml=$compose_version"
          if [ "$tag" != "$mix_version" ] || [ "$tag" != "$compose_version" ]; then
            echo "version mismatch" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: stashix_web
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
