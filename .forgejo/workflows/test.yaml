name: Test

on:
  push:
    paths:
      - "stashix_web/lib/**"
      - "stashix_web/priv/**"
      - "stashix_web/test/**"
      - "stashix_web/mix.exs"
      - "stashix_web/mix.lock"
      - ".forgejo/workflows/test.yaml"
  pull_request:
    paths:
      - "stashix_web/lib/**"
      - "stashix_web/priv/**"
      - "stashix_web/test/**"
      - "stashix_web/mix.exs"
      - "stashix_web/mix.lock"
      - ".forgejo/workflows/test.yaml"

jobs:
  test:
    runs-on: act-ubuntu-24.04-amd64
    env:
      ELIXIR_VERSION: "1.20.4"
      OTP_VERSION: "28.4"

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stashix
          POSTGRES_PASSWORD: stashix
          POSTGRES_DB: stashix_test
        options: >-
          --health-cmd "pg_isready -U stashix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: checkout code
        uses: https://code.forgejo.org/actions/checkout@v7

      - name: cache elixir install
        id: cache-elixir
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: ~/.elixir-install
          key: ${{ runner.os }}-elixir-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}

      - name: install elixir
        if: steps.cache-elixir.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSO https://elixir-lang.org/install.sh
          sh install.sh elixir@$ELIXIR_VERSION otp@$OTP_VERSION

      - name: add elixir to path
        shell: bash
        run: |
          installs_dir="$HOME/.elixir-install/installs"
          otp_major="${OTP_VERSION%%.*}"
          echo "$installs_dir/otp/$OTP_VERSION/bin" >> "$GITHUB_PATH"
          echo "$installs_dir/elixir/$ELIXIR_VERSION-otp-$otp_major/bin" >> "$GITHUB_PATH"

      - name: cache deps
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: |
            stashix_web/deps
            stashix_web/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('stashix_web/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: install hex and rebar
        shell: sh
        run: mix local.hex --force && mix local.rebar --force

      - name: install dependencies
        shell: sh
        working-directory: stashix_web
        run: mix deps.get

      - name: compile
        shell: sh
        working-directory: stashix_web
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: run tests
        shell: sh
        working-directory: stashix_web
        run: mix test
        env:
          MIX_ENV: test
