services:
  phoenix:
    build:
      context: ./stashix_web
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      PORT: 4000
      DATA_DIR: /data
    volumes:
      - ${LIBRARY_PATH}:/libraries:ro
      - phoenix_data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stashix}
      POSTGRES_USER: ${POSTGRES_USER:-stashix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stashix}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  phoenix_data:
