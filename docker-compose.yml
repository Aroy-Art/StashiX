---
services:
  stashix:
    image: ghcr.io/aroy-art/stashix:0.0.1
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Built from the POSTGRES_* values below unless set in .env (for example
      # to use an external database).
      DATABASE_URL: ${DATABASE_URL:-ecto://${POSTGRES_USER:-stashix}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/${POSTGRES_DB:-stashix}}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STASHIX_ENCRYPTION_KEY: ${STASHIX_ENCRYPTION_KEY:?set STASHIX_ENCRYPTION_KEY in .env}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # LIBRARIES_PATH is the media folder on the host (this machine). It
      # appears inside the container as /libraries; point each library in
      # Stashix at a folder under it, such as /libraries/comics.
      # LIBRARY_PATH is the old name, still read for existing installs.
      # Read-write so edited metadata can be written back to your files. To
      # mount it read-only (:ro), first turn off "Write metadata to files"
      # in Admin > Metadata.
      - ${LIBRARIES_PATH:-${LIBRARY_PATH:-./libraries}}:/libraries
      - stashix_data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stashix}
      POSTGRES_USER: ${POSTGRES_USER:-stashix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stashix}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  stashix_data:
