# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is hand-edited; git-cliff only drafts the newest release on top
# of it. Use the script, never `git cliff -o CHANGELOG.md` (that regenerates
# the whole file and throws away the edited notes of past releases):
#
#   scripts/changelog.sh vX.Y.Z   # add the release, then edit it by hand
#   git cliff --unreleased        # preview, prints to the terminal

[changelog]
# With --prepend, git-cliff writes this header, the new release, then the old
# file with this exact header cut off its top. Keep it byte-for-byte equal to
# the top of CHANGELOG.md, down to `## [Unreleased]`.
header = """
# Changelog

All notable changes to Stashix are listed here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/). Before 1.0.0 the database schema and
API can change between any two releases; back up the database before
upgrading.

## [Unreleased]
"""
# One release in the Keep a Changelog style of the hand-written entries.
# scripts/changelog.sh adds the "[x.y.z]: url" link at the bottom of the file,
# which the project site uses as the release notes link. Groups are ordered by
# the hidden <!-- n --> prefix.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/aroy-art/stashix/pull/{{ commit.remote.pr_number }})){% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/aroy-art/stashix/commit/{{ commit.id }}))\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})\
{% else %} by {{ commit.author.name }}{% endif %}
{%- endfor %}
{% endfor %}"""
# Whitespace is handled in the templates so entries join up cleanly.
trim = false
render_always = false

# Looks up GitHub usernames and PR numbers for the commits. Set GITHUB_TOKEN
# to get past the unauthenticated rate limit; without it, lines fall back to
# the git author name and carry no PR link.
[remote.github]
owner = "aroy-art"
repo = "stashix"

[git]
# A squash-merged PR's "(#123)" suffix becomes the PR link instead.
commit_preprocessors = [
    { pattern = '\s*\(#[0-9]+\)$', replace = "" },
]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Only what a user of Stashix would notice; the rest stays in git log.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^\\w+\\((readme|changelog|docs|ci|pages|release|deps)\\)", skip = true },
    { body = "(?i)security", group = "<!-- 4 -->Security" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^perf", group = "<!-- 1 -->Changed" },
    { message = "^revert", group = "<!-- 2 -->Removed" },
    { message = "^fix", group = "<!-- 3 -->Fixed" },
    { message = ".*", skip = true },
]
filter_commits = true
topo_order_commits = true
sort_commits = "oldest"
