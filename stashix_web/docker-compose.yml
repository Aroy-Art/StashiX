version: "3.8"

services:
  db:
    image: postgres:18-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: stashix
      POSTGRES_USER: stashix
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashix"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "ecto://stashix:changeme@db:5432/stashix"
      SECRET_KEY_BASE: "changeme-long-random-string-at-least-64-chars-for-production-use"
      JWT_SECRET: "changeme-jwt-secret"
      PHX_HOST: "localhost"
      LIBRARY_PATH: "/libraries"
      DATA_DIR: "/data"
    volumes:
      - "${LIBRARY_PATH:-/tmp/libraries}:/libraries:ro"
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
