---
name: stashix-dev

services:
  app:
    image: ghcr.io/aroy-art/stashix:dev
    build:
      context: ./stashix_web/
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    # Dev-only values, hardcoded so the prod-oriented .env can't override them.
    environment:
      DATABASE_URL: postgresql://stashix:stashix@db/stashix
      SECRET_KEY_BASE: meSrQUhnKGOZ6RP9U/7scoNw6u0pL3/MDEkw6gDDNdCXtNkjkiFdUVTlWa8xOQ9q
      JWT_SECRET: CNXGp1GrVP8ybgiJeMbypaSj64npgzMpsWAv+bVV3p0rfVpQAdPXitfVg2F/ca1l
      PHX_HOST: localhost
      PORT: 4000
      DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./libraries:/libraries
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stashix
      POSTGRES_USER: stashix
      POSTGRES_PASSWORD: stashix
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashix"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stashix.dev
      PGADMIN_DEFAULT_PASSWORD: stashix
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin

volumes:
  app_data:
  postgres_dev_data:
  pgadmin_dev_data:
