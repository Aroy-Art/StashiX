services:
  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stashix
      POSTGRES_USER: stashix
      POSTGRES_PASSWORD: stashix
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
