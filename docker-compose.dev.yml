---
name: stashix-dev

services:
  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stashix
      POSTGRES_USER: stashix
      POSTGRES_PASSWORD: stashix
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashix"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stashix.dev
      PGADMIN_DEFAULT_PASSWORD: stashix
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin

volumes:
  postgres_dev_data:
  pgadmin_dev_data:
